# Settings for script/process-check and script/pr-check. One `key = value` per line; lists are
# space-separated globs (* and ? stay inside a path segment, ** crosses segments, a leading **/
# also matches the root). Keys left out take the defaults shown here.

# Requirement IDs, as a Python regex. Declared in requirement files as `- **<ID>** ...`.
id_regex = CT-[0-9]{3}

# Files that declare requirements.
requirements = docs/requirements*.md

# Test files. pr-check requires a `fix` PR to touch one.
tests = **/*_test.go

# Files searched for `Validates: <ID>` tags. Empty means the same as tests; add automated checks
# that are not test files (a release workflow's verify step, say) here, never to tests.
validates = **/*_test.go .github/workflows/release.yml

# Docs whose relative links and cited paths must resolve.
docs = CLAUDE.md docs/**/*.md

# A backticked name without a slash counts as a cited file when it has one of these extensions;
# it must then be the name of some file in the repository.
cited_exts = md go py sh swift ts tsx js rs yml yaml

# Regexes for backticked text that looks like a path but is not one in this repository (NNNN:
# placeholders such as `docs/adr/NNNN-title.md`).
ignore_paths = NNNN
