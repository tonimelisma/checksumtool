# Weekly update proposals, one grouped pull request per ecosystem: the Go modules and the
# workflows' actions (pinned by commit SHA with a `# vX.Y.Z` comment, which Dependabot keeps up to
# date). Security updates open right away regardless.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      go-modules:
        patterns: ["*"]
